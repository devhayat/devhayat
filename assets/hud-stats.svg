<rect x="448.0" y="14" width="142" height="5" rx="2.5" fill="#7C3AED"/>
<text x="519.0" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#purple)" filter="url(#glow)">5x</text>
<text x="519.0" y="124" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', 'Courier New', monospace" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">FIRST PRIZES</text>
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.24s" fill="freeze"/>
</g>
<g>
