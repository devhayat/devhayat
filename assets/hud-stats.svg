<rect x="32.0" y="14" width="142" height="5" rx="2.5" fill="#06B6D4"/>
<text x="103.0" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#cyan)" filter="url(#glow)">200+</text>
<text x="103.0" y="124" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', 'Courier New', monospace" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">STUDENTS MENTORED</text>
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
</g>
<g>
<rect x="218.0" y="14" width="186" height="142" rx="16" fill="url(#bg)" stroke="#FBD000" stroke-opacity="0.55" stroke-width="2"/>
<rect x="240.0" y="14" width="142" height="5" rx="2.5" fill="#FBD000"/>
<text x="311.0" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="url(#gold)" filter="url(#glow)">2ND</text>
<text x="311.0" y="124" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', 'Courier New', monospace" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="2">BUILD VS BREAK</text>
<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.12s" fill="freeze"/>
</g>
<g>
